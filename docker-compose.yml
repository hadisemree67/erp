version: '3.8'

services:
  # MySQL - Veritabanı
  db:
    image: mysql:8.0
    container_name: stokerp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: stokerp_password
      MYSQL_DATABASE: stokerp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # İstenirse başlangıç şeması için:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # Redis - Ön bellek ve Session/Idempotency yönetimi
  redis:
    image: redis:alpine
    container_name: stokerp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Backend API Sunucusu
  backend:
    build: 
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: stokerp_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=stokerp_password
      - DB_NAME=stokerp
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=stokerp_super_secret_key_2026
    depends_on:
      - db
      - redis

volumes:
  mysql_data:
  redis_data:
